apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "web-dev"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-inject-secret-db.properties: "secret/data/shop/dev/web"
        vault.hashicorp.com/agent-inject-template-db.properties: |
          {{- with secret "secret/data/shop/dev/web" -}}
          API_KEY={{ .Data.data.api_key }}
          DB_USER={{ .Data.data.db_user }}
          DB_PASSWORD={{ .Data.data.db_password }}
          {{- end }}
    spec:
      serviceAccountName: web
      containers:
        - name: web
          image: busybox:1.36
          command: ["sh", "-c", "echo 'Vault Agent injection demo is running'; sleep 36000"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
